[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colabgraphics"
version = "0.0.1"
description = "Describe a rendering technique in a notebook, write its shaders in HLSL, run it with WebGPU"
readme = "README.md"
requires-python = ">=3.10"
# slangpy is installed for the Slang shader compiler library it contains (HLSL to WGSL).
dependencies = ["numpy", "slangpy"]

[project.optional-dependencies]
images = ["pillow"]

[tool.hatch.build.targets.wheel]
packages = ["src/colabgraphics"]
